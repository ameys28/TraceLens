# OpenTelemetry Collector: receives OTLP from the demo services and forwards
# batches to the TraceLens ingest API as OTLP/HTTP JSON.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlphttp/tracelens:
    endpoint: http://platform:8080        # collector appends /v1/traces
    encoding: json
    compression: none
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      queue_size: 2000

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tracelens]
