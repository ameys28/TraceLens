server:
  port: 8080
  # OTLP batches can be large
  tomcat:
    max-swallow-size: 20MB
spring:
  application:
    name: tracelens-platform
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://localhost:5433/tracelens
    username: tracelens
    password: tracelens
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: localhost
      port: 6380
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      acks: 1
      compression-type: lz4
      properties:
        linger.ms: 20
        batch.size: 131072
    consumer:
      group-id: tracelens-processor
      auto-offset-reset: earliest
      max-poll-records: 2000
    listener:
      type: batch
      concurrency: 3

tracelens:
  span-topic: tracelens.spans
  retention-days: 7
  rollup-retention-days: 30
  sampling:
    # how long a trace must be quiet before the tail-sampling decision is made
    decision-wait-ms: 10000
    poll-interval-ms: 1000
    baseline-rate: 0.10
    default-slow-threshold-ms: 500
    min-slow-threshold-ms: 20
  alerting:
    enabled: true
    evaluation-interval-ms: 30000
    recent-window-minutes: 5
    baseline-window-minutes: 60
    webhook-url: ""
  chaos-targets:
    gateway: http://gateway:8080
    "[order-service]": http://order-service:8080
    "[inventory-service]": http://inventory-service:8080
    "[payment-service]": http://payment-service:8080
    "[notification-service]": http://notification-service:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.apache.kafka: WARN
