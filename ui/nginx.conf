server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve "platform" at request time through Docker's DNS, so nginx starts even if the platform is still booting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $platform http://platform:8080;

  location /api/ {
    proxy_pass $platform;
    # keep the browser's host (localhost:3000) so the platform sees same-origin requests
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
